name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: yes
          use-verbose-mode: no
          config-file: .github/workflows/mlc_config.json

      - name: Validate directory structure
        run: |
          echo "Checking directory structure..."
          for dir in models algorithms competitions templates ai-tools tools data papers notes; do
            if [ -d "$dir" ]; then
              echo "  [OK] $dir/"
            else
              echo "  [MISSING] $dir/"
            fi
          done

      - name: Check template files
        run: |
          for f in templates/*.tex; do
            [ -f "$f" ] && echo "  [OK] $f" || true
          done
          for f in templates/*.py; do
            [ -f "$f" ] && echo "  [OK] $f" || true
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas scikit-learn statsmodels pytest

      - name: Run core algorithm tests
        run: |
          python -m pytest algorithms/python/tests/ -v --tb=short

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check algorithms/python/ --ignore E501,N802,N803 || true
